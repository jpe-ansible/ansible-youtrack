---
- name: Read the current items
  block:
    - name: Request the items
      ansible.builtin.uri:
        url: "{{ custom_fields_read_url }}"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Bearer {{ youtrack_api_key }}"
        validate_certs: "{{ custom_fields_validate_certs }}"
      check_mode: false
      no_log: true
      register: custom_fields_read
  rescue:
    - name: Stop when the items cannot be read
      ansible.builtin.fail:
        msg: >-
          Reading the {{ custom_fields_read_what }} failed with HTTP status
          {{ ansible_failed_result.status | default('unknown') }}.

- name: Keep the read result for later tasks
  ansible.builtin.set_fact:
    custom_fields_reads: >-
      {{ custom_fields_reads | default({}) | combine({custom_fields_read_key: custom_fields_read.json}) }}
