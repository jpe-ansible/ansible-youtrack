---
argument_specs:
  main:
    short_description: Ensure YouTrack global custom fields exist and are attached to the declared projects.
    options:
      youtrack_url:
        type: str
        required: true
        description: Base URL of the YouTrack server, for example https://youtrack.example.com. No trailing slash.
      youtrack_api_key:
        type: str
        required: true
        no_log: true
        description: >-
          Permanent token of a user who can administer fields and projects. Sent as a bearer token and never logged.
      youtrack_validate_certs:
        type: bool
        required: false
        default: true
        description: Verify the server certificate. Set to false only for a test server with a self-signed certificate.
      custom_fields_declared:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Global custom fields to ensure. A missing field is created, and it is attached to each declared project that
          does not have it yet. Nothing is detached or removed.
        options:
          name:
            type: str
            required: true
            description: Name of the custom field. The field is matched by this name.
          field_type:
            type: str
            required: true
            choices:
              - string
              - text
              - integer
              - float
              - date
              - date and time
              - period
              - enum[1]
              - enum[*]
              - state[1]
            description: >-
              Field type. An enum or state field needs a bundle. The type of an existing field is never changed.
          bundle:
            type: str
            required: false
            description: >-
              Name of an existing enum or state bundle. It is the default bundle of a new field, and each attachment
              must already use it.
          projects:
            type: list
            elements: str
            required: false
            default: []
            description: Short names of the projects the field is attached to.
          can_be_empty:
            type: bool
            required: false
            default: true
            description: >-
              Whether an issue in each attached project may leave the field empty. Only an enum or state field takes
              false. The role stops when a field of another type declares false.
