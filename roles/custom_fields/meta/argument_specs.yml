---
argument_specs:
  main:
    short_description: Ensure YouTrack global custom fields exist and are attached to the declared projects.
    options:
      youtrack_url:
        type: str
        required: true
        description: Base URL of the YouTrack server, for example https://youtrack.example.com. No trailing slash.
      youtrack_api_key:
        type: str
        required: true
        no_log: true
        description: >-
          Permanent token of a user who can administer fields and projects. Sent as a bearer token and never logged.
      youtrack_validate_certs:
        type: bool
        required: false
        default: true
        description: Verify the server certificate. Set to false only for a test server with a self-signed certificate.
      custom_fields_declared:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Global custom fields to ensure. A missing field is created, and it is attached to each declared project that
          does not have it yet. Nothing is detached or removed.
        options:
          name:
            type: str
            required: true
            description: Name of the custom field. The field is matched by this name.
          field_type:
            type: str
            required: true
            choices:
              - string
              - text
              - integer
              - float
              - date
              - date and time
              - period
              - enum[1]
              - enum[*]
              - state[1]
              - version[1]
              - version[*]
              - build[1]
              - build[*]
              - ownedField[1]
              - ownedField[*]
              - user[1]
              - user[*]
            description: >-
              Field type. An enum, state, version, build, ownedField or user field needs a bundle. The type of an
              existing field is never changed.
          bundle:
            type: str
            required: false
            description: >-
              Name of an existing bundle of the field's kind: enum, state, version, build, ownedField or user. It is the
              default bundle of a new field. Each attachment must use it, unless its project has a project_overrides
              entry with its own bundle.
          projects:
            type: list
            elements: str
            required: false
            default: []
            description: >-
              Short names of the projects the field is attached to. A project named in project_overrides takes its
              settings from there.
          can_be_empty:
            type: bool
            required: false
            default: true
            description: >-
              Whether an issue in each attached project may leave the field empty. Only a bundle-backed field takes
              false: enum, state, version, build, ownedField or user. The role stops when a field of another type
              declares false. A project_overrides entry can set its own value.
          project_overrides:
            type: list
            elements: dict
            required: false
            default: []
            description: >-
              Projects whose attachment takes its own bundle, its own empty-value setting, or both. Each project is
              attached like a project in projects. A key an entry omits falls back to the field-level bundle or
              can_be_empty.
            options:
              project:
                type: str
                required: true
                description: Short name of the project. Each project may appear once in project_overrides.
              bundle:
                type: str
                required: false
                description: >-
                  Name of an existing bundle of the same kind as the field. Only a bundle-backed field takes a bundle.
              can_be_empty:
                type: bool
                required: false
                description: >-
                  Whether an issue in this project may leave the field empty. Only a bundle-backed field takes false.
