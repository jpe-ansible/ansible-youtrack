---
argument_specs:
  main:
    short_description: Ensure YouTrack global custom fields exist and are attached to the declared projects.
    options:
      youtrack_url:
        type: str
        required: true
        description: Base URL of the YouTrack server, without a trailing slash.
      youtrack_api_key:
        type: str
        required: true
        no_log: true
        description: API token sent as a bearer token on every request.
      youtrack_validate_certs:
        type: bool
        required: false
        description: Verify the server certificate. Defaults to true.
      youtrack_custom_fields:
        type: list
        elements: dict
        required: false
        description: >-
          Global custom fields to ensure. Missing fields are created and attached. Nothing is detached or removed.
          Defaults to an empty list.
        options:
          name:
            type: str
            required: true
          field_type:
            type: str
            required: true
            choices:
              - string
              - text
              - integer
              - float
              - date
              - date and time
              - period
              - enum[1]
              - enum[*]
              - state[1]
              - state[*]
            description: Field type identifier. A field of type enum or state needs a bundle.
          bundle:
            type: str
            required: false
            description: >-
              Name of the existing enum or state bundle that the field defaults to. Required for enum and state types.
          projects:
            type: list
            elements: str
            required: false
            default: []
            description: Short names of the projects the field is attached to.
          can_be_empty:
            type: bool
            required: false
            default: true
            description: Whether an issue in each attached project may leave the field empty.
