---
argument_specs:
  main:
    short_description: Ensure YouTrack enum and state bundles exist with the declared values.
    options:
      youtrack_url:
        type: str
        required: true
        description: Base URL of the YouTrack server, for example https://youtrack.example.com. No trailing slash.
      youtrack_api_key:
        type: str
        required: true
        no_log: true
        description: Permanent token of a user who can administer bundles. Sent as a bearer token and never logged.
      youtrack_validate_certs:
        type: bool
        required: false
        default: true
        description: Verify the server certificate. Set to false only for a test server with a self-signed certificate.
      bundles_enum:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Enum bundles to ensure. A missing bundle is created, and a missing value is added. Values that are not
          declared stay as they are. Nothing is removed.
        options:
          name:
            type: str
            required: true
            description: Name of the bundle. The bundle is matched by this name.
          values:
            type: list
            elements: dict
            required: true
            description: Values the bundle must contain. Each value is matched by its name within the bundle.
            options:
              name:
                type: str
                required: true
                description: Name of the value.
              color_id:
                type: str
                required: false
                description: >-
                  Color of the value as a palette index, for example "1". Left as it is when omitted.
              description:
                type: str
                required: false
                description: Description of the value. Left as it is when omitted.
      bundles_state:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          State bundles to ensure. A missing bundle is created, and a missing value is added. Values that are not
          declared stay as they are. Nothing is removed.
        options:
          name:
            type: str
            required: true
            description: Name of the bundle. The bundle is matched by this name.
          values:
            type: list
            elements: dict
            required: true
            description: Values the bundle must contain. Each value is matched by its name within the bundle.
            options:
              name:
                type: str
                required: true
                description: Name of the value.
              is_resolved:
                type: bool
                required: true
                description: Whether an issue in this state counts as resolved.
              description:
                type: str
                required: false
                description: Description of the value. Left as it is when omitted.
