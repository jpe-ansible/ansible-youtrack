---
- name: Set the certificate check for the bundle requests
  ansible.builtin.set_fact:
    bundles_validate_certs: "{{ youtrack_validate_certs | default(true) }}"

- name: Ensure the enum bundles match the declared bundles
  ansible.builtin.include_tasks: kind.yml
  when: bundles_enum | default([]) | length > 0
  vars:
    bundles_kind: enum
    bundles_declared: "{{ bundles_enum | default([]) }}"

- name: Ensure the state bundles match the declared bundles
  ansible.builtin.include_tasks: kind.yml
  when: bundles_state | default([]) | length > 0
  vars:
    bundles_kind: state
    bundles_declared: "{{ bundles_state | default([]) }}"

- name: Ensure the version bundles match the declared bundles
  ansible.builtin.include_tasks: kind.yml
  when: bundles_version | default([]) | length > 0
  vars:
    bundles_kind: version
    bundles_declared: "{{ bundles_version | default([]) }}"

- name: Ensure the build bundles match the declared bundles
  ansible.builtin.include_tasks: kind.yml
  when: bundles_build | default([]) | length > 0
  vars:
    bundles_kind: build
    bundles_declared: "{{ bundles_build | default([]) }}"

- name: Ensure the owned bundles match the declared bundles
  ansible.builtin.include_tasks: kind.yml
  when: bundles_owned | default([]) | length > 0
  vars:
    bundles_kind: owned
    bundles_declared: "{{ bundles_owned | default([]) }}"

- name: Ensure the user bundles match the declared bundles
  ansible.builtin.include_tasks: kind.yml
  when: bundles_user | default([]) | length > 0
  vars:
    bundles_kind: user
    bundles_declared: "{{ bundles_user | default([]) }}"
