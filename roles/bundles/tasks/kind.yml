---
- name: Stop when two declared bundles of this kind have the same name
  ansible.builtin.assert:
    that:
      - bundles_declared | map(attribute='name') | unique | list | length == bundles_declared | length
    fail_msg: "Two declared {{ bundles_kind }} bundles have the same name. Each bundle name must be unique."

- name: Read every bundle of this kind
  ansible.builtin.include_tasks: read_page.yml
  vars:
    bundles_paged_url: "{{ youtrack_url }}{{ bundles_path }}/{{ bundles_kind }}\
      ?fields=id,name,values({{ bundles_kinds[bundles_kind].value_fields }})"
    bundles_paged_size: "{{ bundles_page_size }}"
    bundles_paged_max: "{{ bundles_read_limit }}"
    bundles_paged_skip: 0
    bundles_paged_rows: []
    bundles_paged_what: "{{ bundles_kind }} bundles"
    bundles_paged_validate_certs: "{{ bundles_validate_certs }}"

- name: Keep the bundles read for the bundle tasks
  ansible.builtin.set_fact:
    bundles_before: "{{ bundles_paged_result }}"

- name: Ensure each declared bundle of this kind exists with its values
  ansible.builtin.include_tasks: bundle.yml
  loop: "{{ bundles_declared }}"
  loop_control:
    loop_var: bundles_item
    label: "{{ bundles_kind }} bundle {{ bundles_item.name }}"
