---
# Reads every user into bundles_user_ids, which maps each login to the user id. The bundle tasks write the id, and they
# stop before any write when a declared login is not in this map.
- name: Read every user
  ansible.builtin.include_tasks: read_page.yml
  vars:
    bundles_paged_url: "{{ youtrack_url }}{{ bundles_users_path }}?fields=id,login"
    bundles_paged_size: "{{ bundles_page_size }}"
    bundles_paged_max: "{{ bundles_read_limit }}"
    bundles_paged_skip: 0
    bundles_paged_rows: []
    bundles_paged_what: users
    bundles_paged_validate_certs: "{{ bundles_validate_certs }}"

- name: Keep the user ids by login
  ansible.builtin.set_fact:
    bundles_user_ids: "{{ bundles_paged_result | items2dict(key_name='login', value_name='id') }}"
