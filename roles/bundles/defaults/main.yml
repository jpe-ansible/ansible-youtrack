---
bundles_path: /api/admin/customFieldSettings/bundles

# Entries requested per page. Pages are read until one comes back empty, so a list longer than one page is read in full.
bundles_page_size: 100

# Most entries that one list read may return. A list that reaches this limit stops the run instead of being cut short.
bundles_read_limit: 10000

# REST type names of each bundle kind. Both names are the $type values in the documented samples.
bundles_kinds:
  enum:
    bundle_type: EnumBundle
    value_fields: "id,name,ordinal,description,color(id)"
  state:
    bundle_type: StateBundle
    value_fields: "id,name,ordinal,description,isResolved"
