---
# Reads one page of a list, then the next page, until a page comes back empty.
# The complete list is left in link_types_paged_result.
# Inputs: link_types_paged_url, link_types_paged_size, link_types_paged_max,
# link_types_paged_skip, link_types_paged_rows, link_types_paged_what and
# link_types_paged_validate_certs.
- name: Stop when the list is longer than the read limit
  ansible.builtin.fail:
    msg: >-
      The list of {{ link_types_paged_what }} has more than {{ link_types_paged_max }} entries.
      The run stopped rather than act on a partial list.
  when: link_types_paged_skip | int > link_types_paged_max | int

- name: Read one page of the list
  block:
    - name: Request the page
      ansible.builtin.uri:
        url: "{{ link_types_paged_url }}&$top={{ link_types_paged_size }}&$skip={{ link_types_paged_skip }}"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Bearer {{ youtrack_api_key }}"
        validate_certs: "{{ link_types_paged_validate_certs }}"
        return_content: true
      check_mode: false
      no_log: true
      register: link_types_paged_response
  rescue:
    - name: Stop when the page cannot be read
      ansible.builtin.fail:
        msg: >-
          Reading the {{ link_types_paged_what }} failed with HTTP status
          {{ ansible_failed_result.status | default('unknown') }}.
          Server response: {{ ansible_failed_result.content | default('none') | truncate(300) }}

- name: Stop when the server does not return a list
  ansible.builtin.assert:
    that:
      - link_types_paged_response.json is sequence
      - link_types_paged_response.json is not mapping
    fail_msg: "Reading the {{ link_types_paged_what }} returned a response that is not a list."

- name: Keep the complete list when the page is empty
  ansible.builtin.set_fact:
    link_types_paged_result: "{{ link_types_paged_rows }}"
  when: link_types_paged_response.json | length == 0

# The next page gets its own names. Passing link_types_paged_rows to itself would make the template refer to itself.
- name: Keep the rows and offset for the next page
  ansible.builtin.set_fact:
    link_types_paged_next_rows: "{{ link_types_paged_rows + link_types_paged_response.json }}"
    link_types_paged_next_skip: "{{ link_types_paged_skip | int + link_types_paged_response.json | length }}"
  when: link_types_paged_response.json | length > 0

- name: Read the next page
  ansible.builtin.include_tasks: read_page.yml
  when: link_types_paged_response.json | length > 0
  vars:
    link_types_paged_rows: "{{ link_types_paged_next_rows }}"
    link_types_paged_skip: "{{ link_types_paged_next_skip }}"
