---
- name: Verify the argument specs of the bundles, custom_fields and link_types roles
  hosts: all
  gather_facts: false
  vars:
    argspec_options:
      bundles: "{{ argspec_bundles.argument_specs.main.options }}"
      custom_fields: "{{ argspec_custom_fields.argument_specs.main.options }}"
      link_types: "{{ argspec_link_types.argument_specs.main.options }}"
    argspec_connection:
      youtrack_url: https://youtrack.example.com
      youtrack_api_key: example-token
    argspec_cases:
      - name: bundles accepts enum and state bundles
        role: bundles
        expect: pass
        provided: >-
          {{ argspec_connection | combine({
            'youtrack_enum_bundles': [{'name': 'Priorities',
              'values': [{'name': 'Must', 'color_id': '20', 'description': 'Top tier'}]}],
            'youtrack_state_bundles': [{'name': 'Work States', 'values': [{'name': 'Hold', 'is_resolved': false}]}]}) }}
      - name: bundles accepts a connection with no bundles
        role: bundles
        expect: pass
        provided: "{{ argspec_connection }}"
      - name: bundles rejects a missing URL
        role: bundles
        expect: fail
        error: "missing required arguments: youtrack_url"
        provided:
          youtrack_api_key: example-token
      - name: bundles rejects a missing API key
        role: bundles
        expect: fail
        error: "missing required arguments: youtrack_api_key"
        provided:
          youtrack_url: https://youtrack.example.com
      - name: bundles rejects a bundle without values
        role: bundles
        expect: fail
        error: "values found in youtrack_enum_bundles"
        provided: >-
          {{ argspec_connection | combine({'youtrack_enum_bundles': [{'name': 'Priorities'}]}) }}
      - name: bundles rejects a state value without is_resolved
        role: bundles
        expect: fail
        error: "is_resolved found in youtrack_state_bundles"
        provided: >-
          {{ argspec_connection | combine({'youtrack_state_bundles':
            [{'name': 'Work States', 'values': [{'name': 'Hold'}]}]}) }}
      - name: bundles rejects a non-boolean certificate flag
        role: bundles
        expect: fail
        error: "youtrack_validate_certs"
        provided: >-
          {{ argspec_connection | combine({'youtrack_validate_certs': 'sometimes'}) }}
      - name: custom_fields accepts a bundle-backed field and a simple field
        role: custom_fields
        expect: pass
        provided: >-
          {{ argspec_connection | combine({
            'youtrack_custom_fields': [
              {'name': 'Priority', 'field_type': 'enum[1]', 'bundle': 'Priorities',
               'projects': ['DEMO'], 'can_be_empty': false},
              {'name': 'Estimate', 'field_type': 'integer'}]}) }}
      - name: custom_fields rejects an unknown field type
        role: custom_fields
        expect: fail
        error: "field_type"
        provided: >-
          {{ argspec_connection | combine({'youtrack_custom_fields': [{'name': 'Owner', 'field_type': 'user[1]'}]}) }}
      - name: custom_fields rejects a field without a name
        role: custom_fields
        expect: fail
        error: "name found in youtrack_custom_fields"
        provided: >-
          {{ argspec_connection | combine({'youtrack_custom_fields': [{'field_type': 'string'}]}) }}
      - name: link_types accepts a complete link type
        role: link_types
        expect: pass
        provided: >-
          {{ argspec_connection | combine({'youtrack_link_types': [{'name': 'Depends',
            'source_to_target': 'depends on', 'target_to_source': 'is required for', 'directed': true}]}) }}
      - name: link_types rejects a link type without a target label
        role: link_types
        expect: fail
        error: "target_to_source found in youtrack_link_types"
        provided: >-
          {{ argspec_connection | combine({'youtrack_link_types': [{'name': 'Depends',
            'source_to_target': 'depends on'}]}) }}

  tasks:
    - name: Load the bundles argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/bundles/meta/argument_specs.yml"
        name: argspec_bundles

    - name: Load the custom_fields argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/custom_fields/meta/argument_specs.yml"
        name: argspec_custom_fields

    - name: Load the link_types argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/link_types/meta/argument_specs.yml"
        name: argspec_link_types

    - name: Check each argument spec case
      ansible.builtin.include_tasks: tasks/check_case.yml
      loop: "{{ argspec_cases }}"
      loop_control:
        loop_var: argspec_case
        label: "{{ argspec_case.name }}"
