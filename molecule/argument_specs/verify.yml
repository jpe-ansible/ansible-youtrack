---
- name: Verify the argument specs of the bundles, custom_fields, link_types and export roles
  hosts: all
  gather_facts: false
  vars:
    argspec_options:
      bundles: "{{ argspec_bundles.argument_specs.main.options }}"
      custom_fields: "{{ argspec_custom_fields.argument_specs.main.options }}"
      link_types: "{{ argspec_link_types.argument_specs.main.options }}"
      export: "{{ argspec_export.argument_specs.main.options }}"
    argspec_connection:
      youtrack_url: https://youtrack.example.com
      youtrack_api_key: example-token
    argspec_cases:
      - name: bundles accepts enum and state bundles
        role: bundles
        expect: pass
        provided: >-
          {{ argspec_connection | combine({
            'bundles_enum': [{'name': 'Types',
              'values': [{'name': 'Bug', 'color_id': '1'}]}],
            'bundles_state': [{'name': 'States', 'values': [{'name': 'Submitted', 'is_resolved': false}]}]}) }}
      - name: bundles accepts a connection with no bundles
        role: bundles
        expect: pass
        provided: "{{ argspec_connection }}"
      - name: bundles rejects a missing URL
        role: bundles
        expect: fail
        error: "missing required arguments: youtrack_url"
        provided:
          youtrack_api_key: example-token
      - name: bundles rejects a missing API key
        role: bundles
        expect: fail
        error: "missing required arguments: youtrack_api_key"
        provided:
          youtrack_url: https://youtrack.example.com
      - name: bundles rejects a bundle without values
        role: bundles
        expect: fail
        error: "values found in bundles_enum"
        provided: >-
          {{ argspec_connection | combine({'bundles_enum': [{'name': 'Types'}]}) }}
      - name: bundles rejects a state value without is_resolved
        role: bundles
        expect: fail
        error: "is_resolved found in bundles_state"
        provided: >-
          {{ argspec_connection | combine({'bundles_state':
            [{'name': 'States', 'values': [{'name': 'Submitted'}]}]}) }}
      - name: bundles accepts a color on a state value
        role: bundles
        expect: pass
        provided: >-
          {{ argspec_connection | combine({'bundles_state':
            [{'name': 'States', 'values': [{'name': 'Submitted', 'is_resolved': false, 'color_id': '2'}]}]}) }}
      - name: bundles rejects a state value with a color key other than color_id
        role: bundles
        expect: fail
        error: "color"
        provided: >-
          {{ argspec_connection | combine({'bundles_state':
            [{'name': 'States', 'values': [{'name': 'Submitted', 'is_resolved': false, 'color': '2'}]}]}) }}
      - name: bundles accepts a version bundle with its value attributes
        role: bundles
        expect: pass
        provided: >-
          {{ argspec_connection | combine({'bundles_version': [{'name': 'Releases', 'values': [
            {'name': '1.0', 'description': 'First release', 'color_id': '2', 'released': true,
             'archived': false, 'release_date': 1576367999999}]}]}) }}
      - name: bundles rejects a version value without a name
        role: bundles
        expect: fail
        error: "name found in bundles_version -> values"
        provided: >-
          {{ argspec_connection | combine({'bundles_version':
            [{'name': 'Releases', 'values': [{'description': 'x'}]}]}) }}
      - name: bundles rejects a non-boolean released flag on a version value
        role: bundles
        expect: fail
        error: "released"
        provided: >-
          {{ argspec_connection | combine({'bundles_version': [{'name': 'Releases',
            'values': [{'name': '1.0', 'released': 'sometimes'}]}]}) }}
      - name: bundles rejects a release date that is not a number
        role: bundles
        expect: fail
        error: "release_date"
        provided: >-
          {{ argspec_connection | combine({'bundles_version': [{'name': 'Releases',
            'values': [{'name': '1.0', 'release_date': 'soon'}]}]}) }}
      - name: bundles rejects a non-boolean certificate flag
        role: bundles
        expect: fail
        error: "youtrack_validate_certs"
        provided: >-
          {{ argspec_connection | combine({'youtrack_validate_certs': 'sometimes'}) }}
      - name: custom_fields accepts a bundle-backed field and a simple field
        role: custom_fields
        expect: pass
        provided: >-
          {{ argspec_connection | combine({
            'custom_fields_declared': [
              {'name': 'Type', 'field_type': 'enum[1]', 'bundle': 'Types',
               'projects': ['DEMO'], 'can_be_empty': false},
              {'name': 'Due Date', 'field_type': 'date'}]}) }}
      - name: custom_fields rejects an unknown field type
        role: custom_fields
        expect: fail
        error: "field_type"
        provided: >-
          {{ argspec_connection | combine({
            'custom_fields_declared': [{'name': 'Assignee', 'field_type': 'user[1]'}]}) }}
      - name: custom_fields rejects a field without a name
        role: custom_fields
        expect: fail
        error: "name found in custom_fields_declared"
        provided: >-
          {{ argspec_connection | combine({'custom_fields_declared': [{'field_type': 'string'}]}) }}
      - name: custom_fields accepts a project override with a bundle and an empty-value setting
        role: custom_fields
        expect: pass
        provided: >-
          {{ argspec_connection | combine({
            'custom_fields_declared': [
              {'name': 'Type', 'field_type': 'enum[1]', 'bundle': 'Types', 'projects': ['DEMO'],
               'project_overrides': [{'project': 'SAMPLE', 'bundle': 'Kinds', 'can_be_empty': false}]}]}) }}
      - name: custom_fields accepts a project override that names only a project
        role: custom_fields
        expect: pass
        provided: >-
          {{ argspec_connection | combine({
            'custom_fields_declared': [
              {'name': 'Type', 'field_type': 'enum[1]', 'bundle': 'Types',
               'project_overrides': [{'project': 'SAMPLE'}]}]}) }}
      - name: custom_fields rejects a project override without a project
        role: custom_fields
        expect: fail
        error: "project found in custom_fields_declared -> project_overrides"
        provided: >-
          {{ argspec_connection | combine({
            'custom_fields_declared': [
              {'name': 'Type', 'field_type': 'enum[1]', 'bundle': 'Types',
               'project_overrides': [{'bundle': 'Kinds'}]}]}) }}
      - name: custom_fields rejects a non-boolean empty-value setting in a project override
        role: custom_fields
        expect: fail
        error: "can_be_empty"
        provided: >-
          {{ argspec_connection | combine({
            'custom_fields_declared': [
              {'name': 'Type', 'field_type': 'enum[1]', 'bundle': 'Types',
               'project_overrides': [{'project': 'SAMPLE', 'can_be_empty': 'sometimes'}]}]}) }}
      - name: link_types accepts a complete link type
        role: link_types
        expect: pass
        provided: >-
          {{ argspec_connection | combine({'link_types_declared': [{'name': 'Part',
            'source_to_target': 'Part of', 'target_to_source': 'Part of', 'aggregation': true}]}) }}
      - name: link_types rejects a link type without a target label
        role: link_types
        expect: fail
        error: "target_to_source found in link_types_declared"
        provided: >-
          {{ argspec_connection | combine({'link_types_declared': [{'name': 'Part',
            'source_to_target': 'Part of'}]}) }}
      - name: export accepts a connection with a destination and sections
        role: export
        expect: pass
        provided: >-
          {{ argspec_connection | combine({'export_dest': 'youtrack-config.json',
            'export_sections': ['issue_link_types']}) }}
      - name: export rejects a missing destination
        role: export
        expect: fail
        error: "missing required arguments: export_dest"
        provided: "{{ argspec_connection }}"
      - name: export rejects a missing URL
        role: export
        expect: fail
        error: "missing required arguments: youtrack_url"
        provided:
          youtrack_api_key: example-token
          export_dest: youtrack-config.json
      - name: export rejects a non-boolean certificate flag
        role: export
        expect: fail
        error: "youtrack_validate_certs"
        provided: >-
          {{ argspec_connection | combine({'export_dest': 'youtrack-config.json',
            'youtrack_validate_certs': 'sometimes'}) }}

  tasks:
    - name: Load the bundles argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/bundles/meta/argument_specs.yml"
        name: argspec_bundles

    - name: Load the custom_fields argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/custom_fields/meta/argument_specs.yml"
        name: argspec_custom_fields

    - name: Load the link_types argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/link_types/meta/argument_specs.yml"
        name: argspec_link_types

    - name: Load the export argument spec
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/export/meta/argument_specs.yml"
        name: argspec_export

    - name: Check each argument spec case
      ansible.builtin.include_tasks: tasks/check_case.yml
      loop: "{{ argspec_cases }}"
      loop_control:
        loop_var: argspec_case
        label: "{{ argspec_case.name }}"
