---
driver:
  name: default
  options:
    managed: false

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

scenario:
  test_sequence:
    - syntax
    - converge
    - idempotence
    - verify

verifier:
  name: ansible
