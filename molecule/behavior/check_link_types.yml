---
# Run with ansible-playbook --check by a test case, so ansible_check_mode is true for the whole run.
- name: Link types role in check mode
  hosts: localhost
  gather_facts: false
  vars:
    youtrack_url: "{{ lookup('ansible.builtin.env', 'YTC_TEST_URL') }}"
    youtrack_api_key: "{{ lookup('ansible.builtin.env', 'YTC_TEST_KEY') }}"
  tasks:
    - name: Run the link_types role
      ansible.builtin.include_role:
        name: link_types
      vars:
        link_types_declared:
          - name: Part
            source_to_target: Part of
            target_to_source: Part of
            aggregation: true
