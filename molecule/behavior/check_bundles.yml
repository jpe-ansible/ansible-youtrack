---
# Run by a test case with ansible-playbook, with or without --check, so ansible_check_mode is true only when the case
# passes --check. YTC_TEST_KIND names the bundle kind to declare. It is enum when the variable is not set.
- name: Bundles role for one kind
  hosts: localhost
  gather_facts: false
  vars:
    youtrack_url: "{{ lookup('ansible.builtin.env', 'YTC_TEST_URL') }}"
    youtrack_api_key: "{{ lookup('ansible.builtin.env', 'YTC_TEST_KEY') }}"
    test_kind: "{{ lookup('ansible.builtin.env', 'YTC_TEST_KIND') | default('enum', true) }}"
    test_declared:
      enum:
        - name: Types
          values:
            - name: Bug
              color_id: "1"
      user:
        - name: Teams
          users: [jane.doe]
          groups: [Developers]
      owned:
        - name: Owners
          values:
            - name: Core
              description: Core team
              color_id: "3"
              owner: jane.doe
      build:
        - name: Builds
          values:
            - name: "1.0.0"
              description: Release build
              color_id: "4"
              assemble_date: 1627636495000
      version:
        - name: Releases
          values:
            - name: "1.0"
              description: First release
              color_id: "2"
              released: true
              archived: false
              release_date: 1576367999999
      state:
        - name: States
          values:
            - name: Submitted
              is_resolved: false
              color_id: "2"
  tasks:
    - name: Run the bundles role for the selected kind
      ansible.builtin.include_role:
        name: bundles
      vars:
        bundles_enum: "{{ test_declared['enum'] if test_kind == 'enum' else [] }}"
        bundles_state: "{{ test_declared['state'] if test_kind == 'state' else [] }}"
        bundles_version: "{{ test_declared['version'] if test_kind == 'version' else [] }}"
        bundles_build: "{{ test_declared['build'] if test_kind == 'build' else [] }}"
        bundles_owned: "{{ test_declared['owned'] if test_kind == 'owned' else [] }}"
        bundles_user: "{{ test_declared['user'] if test_kind == 'user' else [] }}"
