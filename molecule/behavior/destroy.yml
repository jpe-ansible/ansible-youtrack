---
- name: Stop the WireMock stub
  hosts: localhost
  gather_facts: false
  vars:
    stub_container: ansible-youtrack-stub
  tasks:
    - name: Find the stub container
      ansible.builtin.command:
        argv: [docker, ps, --all, --quiet, "--filter", "name=^{{ stub_container }}$"]
      changed_when: false
      register: stub_found

    - name: Remove the stub container
      ansible.builtin.command:
        argv: [docker, rm, --force, "{{ stub_container }}"]
      changed_when: true
      when: stub_found.stdout | length > 0
