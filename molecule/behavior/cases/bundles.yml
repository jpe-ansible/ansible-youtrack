              jsonBody:
                - id: "30-1"
                  name: Releases
                  values:
                    - {id: "30-2", name: "1.0", description: First release, color: {id: "2"}, released: true,
                       archived: false, releaseDate: 1576367999999}
          - request:
              method: GET
              urlPath: /api/admin/customFieldSettings/bundles/version
              queryParameters: {"$skip": {equalTo: "1"}}
            response: {status: 200, headers: "{{ stub_json }}", jsonBody: []}
    - name: Load the stub mappings
      ansible.builtin.include_tasks: ../tasks/stub_load.yml
    - name: Run the bundles role for the version kind
      ansible.builtin.include_tasks: ../tasks/run_kind.yml
      vars:
        run_kind_name: version
        run_kind_check: false
    - name: Read the journal
      ansible.builtin.include_tasks: ../tasks/stub_journal.yml
    - name: Assert no writes and a recap with no changed task
      ansible.builtin.assert:
        that:
          - run_kind_result.rc == 0
          - stub_writes | length == 0
          - run_kind_result.stdout is search('changed=0([^0-9]|$)')
        fail_msg: "A second version run with the stored attributes sent writes or reported a change."

- name: Case bundles - check mode predicts the version bundle and value and sends no writes
  block:
    - name: Reset the stub
      ansible.builtin.include_tasks: ../tasks/stub_reset.yml
    - name: Load the mappings of a server with no version bundles
      ansible.builtin.set_fact:
        stub_mappings:
          - request:
              method: GET
              urlPath: /api/admin/customFieldSettings/bundles/version
              queryParameters: {"$skip": {equalTo: "0"}}
            response: {status: 200, headers: "{{ stub_json }}", jsonBody: []}
    - name: Load the stub mappings
      ansible.builtin.include_tasks: ../tasks/stub_load.yml
    - name: Run the bundles role for the version kind in check mode
      ansible.builtin.include_tasks: ../tasks/run_kind.yml
      vars:
        run_kind_name: version
        run_kind_check: true
    - name: Read the journal
      ansible.builtin.include_tasks: ../tasks/stub_journal.yml
    - name: Assert no writes and the planned create and add are reported
      ansible.builtin.assert:
        that:
          - run_kind_result.rc == 0
          - stub_writes | length == 0
          - "'Would create the version bundle Releases.' in run_kind_result.stdout"
          - "'Would add value 1.0 to the version bundle Releases.' in run_kind_result.stdout"
        fail_msg: "Check mode sent writes or did not report the planned version changes."
