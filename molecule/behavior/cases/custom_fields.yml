              status: 200
              headers: "{{ stub_json }}"
              jsonBody:
                id: "61-1"
                canBeEmpty: true
                field: {id: "58-1", name: Type}
                bundle: {id: "10-2", name: Kinds}
    - name: Load the stub mappings
      ansible.builtin.include_tasks: ../tasks/stub_load.yml
    - name: Run the custom_fields role with an override for each project
      ansible.builtin.include_role:
        name: custom_fields
      vars:
        custom_fields_declared:
          - name: Type
            field_type: enum[1]
            bundle: Types
            project_overrides:
              - {project: DEMO, bundle: Types}
              - {project: SAMPLE, bundle: Kinds}
    - name: Read the journal
      ansible.builtin.include_tasks: ../tasks/stub_journal.yml
    - name: Assert the four writes and the bundle each attachment request carries
      ansible.builtin.assert:
        that:
          - stub_writes | length == 4
          - stub_writes[2].request.url.startswith('/api/admin/projects/0-1/customFields?fields=')
          - >-
            stub_writes[2].request.body | from_json == {'field': {'id': '58-1'}, '$type': 'EnumProjectCustomField',
            'bundle': {'id': '10-1', '$type': 'EnumBundle'}}
          - stub_writes[3].request.url.startswith('/api/admin/projects/0-2/customFields?fields=')
          - >-
            stub_writes[3].request.body | from_json == {'field': {'id': '58-1'}, '$type': 'EnumProjectCustomField',
            'bundle': {'id': '10-2', '$type': 'EnumBundle'}}
        fail_msg: "The override case sent unexpected writes."

