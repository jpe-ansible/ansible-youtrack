---
name: Disclosure Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  disclosure-gate:
    name: Disclosure Gate
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_disclosure-gate.yml@v1
    secrets:
      GITLEAKS_PRIVATE_CONFIG: ${{ secrets.GITLEAKS_PRIVATE_CONFIG }}
      GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}
      DISCLOSURE_DENYLIST: ${{ secrets.DISCLOSURE_DENYLIST }}
